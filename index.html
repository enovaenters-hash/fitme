<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FitMe</title>
<meta name="description" content="Enter your measurements once and see clothes that are in stock in your size.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect width=%2264%22 height=%2264%22 rx=%2214%22 fill=%22%23EDB3C0%22/%3E%3Ctext x=%2232%22 y=%2244%22 text-anchor=%22middle%22 font-family=%22Arial%22 font-weight=%22700%22 font-size=%2232%22 fill=%22%232B2326%22%3Efm%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=Public+Sans:wght@400;600;700&family=IBM+Plex+Mono:wght@500&family=Quicksand:wght@700&family=Fraunces:ital,wght@1,500&display=swap">
<style>
/* Default look: Night boutique. Ten white-based colorways below swap the tokens. */
:root{--bg:#12100E;--surface:#1C1916;--raise:#26221D;--line:#3A332B;--text:#EFE6D2;--muted:#A89C84;--gold:#D4AE62;--gold-ink:#1A140A;--gold-text:#D4AE62;--ok:#6E8B6A;--warn:#E08A6C;
  --fd:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;--fb:"Public Sans",system-ui,sans-serif;--fm:"IBM Plex Mono",ui-monospace,monospace;color-scheme:dark}
[data-theme]:not([data-theme="night"]){--bg:#FFFFFF;--ok:#8DB596;--warn:#B4482B;color-scheme:light}
[data-theme="cb"]{--surface:#FDF8F6;--raise:#F8EEEA;--line:#EEDFD9;--text:#2B2326;--muted:#6E6265;--gold:#D9BC82;--gold-ink:#2A1F0B;--gold-text:#8A6A26;--hi:#EDB3C0;--hi-text:#B04E66;--hi-ink:#2B2326}
[data-theme="blush"]{--surface:#FDF5F6;--raise:#F8E8EB;--line:#EED7DC;--text:#2B2023;--muted:#6F5F64;--gold:#E7A3B1;--gold-ink:#2B1418;--gold-text:#A8475C}
[data-theme="champagne"]{--surface:#FCF9F3;--raise:#F5EEDF;--line:#EADFC8;--text:#2A251C;--muted:#6E6556;--gold:#D2B06E;--gold-ink:#241A07;--gold-text:#8A6A26}
[data-theme="lilac"]{--surface:#F8F5FD;--raise:#EEE8FA;--line:#DDD3F2;--text:#241F2E;--muted:#655E73;--gold:#B9A3E6;--gold-ink:#1C1230;--gold-text:#6C4DB3}
[data-theme="sage"]{--surface:#F5F8F5;--raise:#E8F0E9;--line:#D3E0D5;--text:#1F2621;--muted:#5C6860;--gold:#A3C4AC;--gold-ink:#142019;--gold-text:#4A7357}
[data-theme="coral"]{--surface:#FFF6F3;--raise:#FDE8E1;--line:#F5D3C8;--text:#2B1F1C;--muted:#6F605B;--gold:#F4A08A;--gold-ink:#2A120A;--gold-text:#B4482B}
[data-theme="fuchsia"]{--surface:#FDF4F8;--raise:#FAE3EE;--line:#F1CFDF;--text:#2A1C23;--muted:#6E5D66;--gold:#C23A7D;--gold-ink:#FFFFFF;--gold-text:#B0306E}
[data-theme="aqua"]{--surface:#F2FAF9;--raise:#E0F3F1;--line:#C8E6E2;--text:#1A2625;--muted:#586B69;--gold:#7FCAC3;--gold-ink:#0D2422;--gold-text:#2D7D76}
[data-theme="mauve"]{--surface:#FAF5F7;--raise:#F1E6EB;--line:#E3D2DA;--text:#2A2226;--muted:#6B5F65;--gold:#C99AAD;--gold-ink:#22121A;--gold-text:#8A5268}
[data-theme="powder"]{--surface:#F5F8FD;--raise:#E6EEF9;--line:#D2DFF1;--text:#1D2330;--muted:#5D6575;--gold:#A6C4EA;--gold-ink:#0E1C30;--gold-text:#3E6BA8}
[data-theme="cherry"]{--surface:#FFF5F5;--raise:#FCE4E5;--line:#F3CFD1;--text:#2A1C1D;--muted:#6E5D5F;--gold:#C8323C;--gold-ink:#FFFFFF;--gold-text:#B02A33}

*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 var(--fb)}
#app{max-width:560px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;padding:0 max(18px,env(safe-area-inset-left)) 96px}
button{font-family:inherit;color:inherit;cursor:pointer}
a{color:var(--gold-text)}
:focus-visible{outline:2px solid var(--gold-text);outline-offset:2px}
.top{display:flex;justify-content:space-between;align-items:center;padding:18px 0 10px;gap:10px}
.brand{background:none;border:0;padding:0;font:700 34px/1 Quicksand,var(--fb);letter-spacing:-.02em;color:var(--text)}
.brand .i{position:relative;display:inline-block}
.brand .tit{position:absolute;left:50%;top:.06em;width:.24em;height:.24em;margin-left:-.12em;border-radius:50%;background:var(--hi,var(--gold))}
.pill{background:none;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font:500 12px var(--fm);color:var(--muted)}
.icon{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:inline-flex;align-items:center;justify-content:center;color:var(--text)}
.menu{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;border-bottom:1px solid var(--line);margin:0 0 18px}
.menu button{flex:1 1 auto;background:none;border:0;padding:12px 6px 11px;font-size:12px;font-weight:700;letter-spacing:.08em;white-space:nowrap;text-transform:uppercase;color:var(--muted);border-bottom:3px solid transparent}
.menu button[aria-current="page"]{color:var(--text);border-bottom-color:var(--hi,var(--gold))}
.d{font-family:var(--fd);font-weight:800;text-transform:uppercase;line-height:.95;margin:0;letter-spacing:.02em}
.lb{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.m{font-family:var(--fm)}
.muted{color:var(--muted)}
.btn{display:block;width:100%;background:var(--gold);color:var(--gold-ink);border:0;border-radius:2px;padding:15px;font:700 13px var(--fb);letter-spacing:.14em;text-transform:uppercase;text-align:center;text-decoration:none}
.btn.ghost{background:transparent;color:var(--gold-text);border:1px solid var(--gold-text)}
.link{align-self:flex-start;text-align:left;background:none;border:0;padding:8px 0;color:var(--muted);font-size:13px;font-weight:600;text-decoration:underline}
.card{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:16px}
.seg{display:flex;border:1px solid var(--line);border-radius:2px;overflow:hidden}
.seg button{flex:1;border:0;background:transparent;padding:12px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--text);color:var(--bg)}
.err{color:var(--warn);font-size:13px;min-height:1.2em}

/* try-on */
.btn.pink{background:var(--hi,var(--gold));color:var(--hi-ink,var(--gold-ink))}
.btn:disabled{opacity:.55;cursor:default}
.trywrap{position:relative}
.tryload{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:color-mix(in srgb,var(--bg) 62%,transparent);font-weight:700;text-align:center;padding:20px;border-radius:3px}
.spin{width:34px;height:34px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--hi-text,var(--gold-text));animation:sp 0.9s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.photo{display:flex;gap:14px;align-items:center}
.photo img,.photo .ph0{width:64px;height:86px;object-fit:cover;border-radius:3px;background:var(--raise);flex-shrink:0}
.filebtn{position:relative;overflow:hidden;cursor:pointer}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.small{font-size:12px;color:var(--muted);margin:0}

/* outfit */
.obar{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--text);color:var(--bg);padding:10px max(16px,env(safe-area-inset-left)) calc(10px + env(safe-area-inset-bottom))}
.obar-in{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:12px}
.obar img{width:34px;height:44px;object-fit:cover;border-radius:2px;background:var(--raise)}
.obar button{margin-left:auto;background:var(--hi,var(--gold));color:var(--hi-ink,var(--gold-ink));border:0;border-radius:2px;padding:10px 14px;font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.piece{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.piece img{width:60px;height:76px;object-fit:cover;border-radius:2px;background:var(--raise);flex-shrink:0}
.steps{display:flex;gap:6px;margin-top:8px}
.steps span{flex:1;height:4px;border-radius:2px;background:var(--line)}
.steps span.on{background:var(--hi-text,var(--gold-text))}
.looks{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:10px}
.look{border:1px solid var(--line);border-radius:2px;overflow:hidden;background:var(--raise);display:flex;flex-direction:column}
.look>img{width:100%;aspect-ratio:4/5;object-fit:cover;display:block;background:var(--line)}
.look .lk-b{padding:8px 10px 10px;display:flex;flex-direction:column;gap:4px;flex:1}
.look .lk-p{font-size:12px;line-height:1.3;display:flex;justify-content:space-between;gap:6px}
.look .lk-p a{font-weight:700;white-space:nowrap}
.look .lk-x{display:flex;justify-content:space-between;margin-top:auto;padding-top:6px}

/* today */
.quote{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:26px 22px 22px}
.qm{display:block;font:italic 500 80px/.6 Fraunces,Georgia,serif;color:var(--hi,var(--gold));margin-top:18px;height:34px}
.quote blockquote{margin:0 0 18px;font:italic 500 30px/1.25 Fraunces,Georgia,serif;color:var(--text);text-wrap:balance}

/* steppers */
.stepper{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:10px}
.stepper .val{font:500 44px/1 var(--fm);text-align:center;flex:1;font-variant-numeric:tabular-nums}
.stepper .val small{font-size:18px;color:var(--muted);margin-left:4px}
.sb{width:60px;height:60px;border-radius:50%;border:1px solid var(--gold-text);background:var(--bg);color:var(--gold-text);font:600 28px/1 var(--fb);touch-action:manipulation;user-select:none;-webkit-user-select:none}
.sb:active{background:var(--gold);color:var(--gold-ink)}
.sb.sm{width:40px;height:40px;font-size:22px}

/* stepper flow (16) */
.bars{display:flex;gap:6px;padding-top:4px}
.bars span{flex:1;height:3px;background:var(--line)}
.bars span.on{background:var(--gold)}
.fig{display:flex;justify-content:center;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:4px;height:220px;margin:18px 0}
.body{stroke:var(--text)}
.band{stroke:var(--line);stroke-width:3}
.band.on{stroke:var(--hi-text,var(--gold-text));stroke-width:5}

/* body map (09) */
.map{position:relative;height:300px;margin-top:8px}
.map svg{position:absolute;left:50%;top:6px;transform:translateX(-50%)}
.call{position:absolute;background:var(--raise);border:1px solid var(--line);border-radius:4px;padding:6px 10px;text-align:left;width:84px;z-index:1}
.call.open{border:2px solid var(--hi-text,var(--gold-text));background:var(--surface)}
.editbar{display:flex;flex-direction:column;gap:8px;margin:4px 0 14px;padding:12px;border:1px solid var(--line);border-radius:4px;background:var(--bg)}
.call .v{font:500 19px var(--fm);display:block;font-variant-numeric:tabular-nums;white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.size{border:1px solid var(--line);border-radius:2px;padding:8px 12px;display:flex;flex-direction:column}
.size b{font:800 26px/1 var(--fd);color:var(--hi-text,var(--gold-text))}

/* tiles (13) */
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tile{border:1px solid var(--line);background:var(--surface);border-radius:4px;padding:16px;height:120px;display:flex;flex-direction:column;justify-content:space-between;text-align:left}
.tile:hover{border-color:var(--gold-text)}
.tile .d{font-size:24px;white-space:nowrap}
.tile.wide{grid-column:span 2;height:90px;background:var(--gold);color:var(--gold-ink);border-color:var(--gold)}
.tile.wide .m{color:var(--gold-ink)}

/* filters + grid (01) */
.row-scroll{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.wrap{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:8px 14px;font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap;min-height:38px}
.chip[aria-pressed="true"]{background:var(--text);color:var(--bg);border-color:var(--text)}
.chip .n{font:500 11px var(--fm);opacity:.75;margin-left:6px}
.searchrow{display:flex;gap:8px}
.searchrow input{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:2px;padding:12px;font:16px var(--fb);color:var(--text)}
.searchrow button{background:var(--text);color:var(--bg);border:0;border-radius:2px;padding:0 16px;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 12px}
.item{background:none;border:0;padding:0;text-align:left;display:flex;flex-direction:column;gap:4px;min-width:0;position:relative}
.ph{aspect-ratio:3/4;width:100%;object-fit:cover;background:var(--raise);border-radius:3px;display:block}
.item .t{font-size:14px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.item .row{display:flex;justify-content:space-between;align-items:center;gap:6px}
.tag{background:var(--gold);color:var(--gold-ink);font:500 11px var(--fm);padding:2px 6px;border-radius:2px;white-space:nowrap}
.new{position:absolute;top:8px;left:8px;background:var(--hi,var(--bg));color:var(--text);font:700 10px var(--fb);letter-spacing:.12em;text-transform:uppercase;padding:4px 7px;border-radius:2px}
.skel{background:var(--raise);border-radius:3px;aspect-ratio:3/4}
.section{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}

/* fit meter (21) */
.meter{height:6px;border-radius:3px;background:linear-gradient(90deg,var(--line) 0 33%,var(--ok) 33% 67%,var(--line) 67%);position:relative;margin-top:8px}
.dot{position:absolute;top:-6px;width:18px;height:18px;margin-left:-9px;border-radius:50%;background:var(--hi-text,var(--gold-text));border:3px solid var(--surface)}
.scale{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:6px}

/* theme sheet */
.sheet{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet-in{background:var(--bg);color:var(--text);width:100%;max-width:560px;border-radius:14px 14px 0 0;padding:20px 18px calc(24px + env(safe-area-inset-bottom));max-height:85vh;overflow:auto}
.themes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}
.th{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:10px;text-align:left;font-weight:600}
.th[aria-pressed="true"]{border:2px solid var(--gold-text)}
.sw{width:34px;height:34px;border-radius:50%;flex-shrink:0;border:1px solid rgba(0,0,0,.12)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>

<script>
const app = document.getElementById("app");
const LS = {
  get(k){ try { return JSON.parse(localStorage.getItem(k)); } catch(e) { return null; } },
  set(k,v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e) {} }
};

/* ---------- constants ---------- */
const THEMES = [
  ["cb","Champagne & Blush","#FFFFFF","#D9BC82","#EDB3C0"],
  ["night","Night boutique","#12100E","#D4AE62"],
  ["blush","Blush","#FFFFFF","#E7A3B1"],["champagne","Champagne","#FFFFFF","#D2B06E"],
  ["lilac","Lilac","#FFFFFF","#B9A3E6"],["sage","Sage","#FFFFFF","#A3C4AC"],
  ["coral","Coral","#FFFFFF","#F4A08A"],["fuchsia","Fuchsia","#FFFFFF","#C23A7D"],
  ["aqua","Aqua","#FFFFFF","#7FCAC3"],["mauve","Mauve","#FFFFFF","#C99AAD"],
  ["powder","Powder blue","#FFFFFF","#A6C4EA"],["cherry","Cherry","#FFFFFF","#C8323C"]
];
const STYLES = [["casual","Casual"],["business","Business"],["formal","Formal"],["streetwear","Streetwear"],["athleisure","Athleisure"],
  ["minimalist","Minimalist"],["boho","Boho"],["preppy","Preppy"],["vintage","Vintage"],["edgy","Edgy"]];
const SEASONS = [["fall","Fall"],["winter","Winter"],["spring","Spring"],["summer","Summer"]];
// Original daily lines, one per day of the year (rotates).
const QUOTES = [
  "The right fit isn't a number. It's how you feel walking out the door.",
  "You were never the problem. The size chart was.",
  "Dress for the day you want, not the size you think you should be.",
  "Confidence looks good in every size.",
  "Wear the thing you've been saving for a special day. Today counts.",
  "Your body is not a before picture.",
  "Find clothes that fit your life, not the other way around.",
  "Comfort and beauty were never meant to compete.",
  "Take up space. Your outfit should help.",
  "Measure yourself with a tape, never with a comparison.",
  "Style is how you introduce yourself without saying a word.",
  "Some days call for heels, some for sneakers. Both are you.",
  "Be kind to the woman in the mirror. She's doing her best.",
  "A great fit is a small act of self-respect.",
  "You don't owe anyone a smaller version of yourself.",
  "Pick the color that makes you smile. That's the right one.",
  "Soft can be strong. Ask any cashmere sweater.",
  "Today, wear something that feels like a yes.",
  "Your favorite outfit is the one you forget you're wearing.",
  "Every body deserves a good pair of jeans.",
  "Show up as you are. Then dress like you mean it.",
  "The best accessory is the way you carry yourself.",
  "Trends come and go. Feeling good in your clothes stays.",
  "You're allowed to change your style as often as you change your mind.",
  "Let the clothes do the adjusting. You're already enough.",
  "Real women have real measurements. Wear yours proudly.",
  "Start with what fits. Everything else is details.",
  "Bold or quiet, your style is yours to choose.",
  "Getting dressed is a gift to yourself, not a test.",
  "Growth looks good on you, in every sense.",
  "Walk in like the outfit was made for you. Today it was."
];
const CAT_NAMES = { all: "Everything", tops: "Tops", bottoms: "Bottoms", outerwear: "Outerwear", dresses: "Dresses", under100: "Under $100" };
const PRICES = [[0,"Any price"],[50,"Under $50"],[100,"Under $100"],[200,"Under $200"]];
const DEF = { m: { chest: 40, waist: 33, hips: 39, inseam: 32 }, w: { chest: 36, waist: 29, hips: 39, inseam: 30 } };
const LIM = { chest: [26, 60], waist: [20, 56], hips: [28, 62], inseam: [22, 38] };
const nowSeason = (() => { const mo = new Date().getMonth(); return mo >= 8 && mo <= 10 ? "fall" : (mo === 11 || mo <= 1) ? "winter" : mo <= 4 ? "spring" : "summer"; })();

/* ---------- state ---------- */
const saved = LS.get("fm_state") || {};
const S = {
  g: saved.g || "m", unit: saved.unit || "in", m: saved.m || null, theme: LS.get("fm_theme2") || "cb",
  view: "today", prev: "search", step: 0, editing: null, sheet: false,
  byCat: null, counting: false, item: null,
  search: { cat: "all", q: "", styles: [], max: 0 },
  newf: { season: nowSeason, cat: "all" },
  photo: LS.get("fm_photo"), tries: {}, outfit: LS.get("fm_outfit") || [], looks: LS.get("fm_looks") || [], ofit: {}, prevOut: "search",
  res: { search: null, new: null }, loading: { search: false, new: false }, err: { search: "", new: "" }
};
const save = () => LS.set("fm_state", { g: S.g, unit: S.unit, m: S.m });
const hasM = () => !!(S.m && ["chest","waist","hips","inseam"].every(k => S.m[k] != null));
document.documentElement.dataset.theme = S.theme;

const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt = v => v == null ? "—" : (S.unit === "in" ? (+v).toFixed(1).replace(/\.0$/, "") : String(Math.round(v * 2.54)));
const uLabel = () => S.unit === "in" ? "in" : "cm";
const clamp = x => Math.max(0.04, Math.min(0.96, x));

/* ---------- sizing ---------- */
const MT=[[35,"XS"],[38.5,"S"],[41.5,"M"],[45,"L"],[49,"XL"],[53,"XXL"],[999,"3XL"]];
const MB=[[29,"XS"],[31.5,"S"],[34.5,"M"],[37.5,"L"],[41,"XL"],[45,"XXL"],[999,"3XL"]];
const WT=[[32.5,"XXS"],[34,"XS"],[36,"S"],[38,"M"],[40.5,"L"],[43.5,"XL"],[999,"XXL"]];
const WB=[[35,"XXS"],[36.5,"XS"],[38.5,"S"],[40.5,"M"],[43,"L"],[46,"XL"],[999,"XXL"]];
const DRESS=[[0,32,24,34.5],[2,33,25,35.5],[4,34,26,36.5],[6,35,27,37.5],[8,36,28,38.5],[10,37.5,29.5,40],[12,39,31,41.5],[14,41,33,43.5],[16,43,35,45.5],[18,45,37,47.5],[20,47,39,49.5]];
function pick(v, t){ if (v == null) return null; for (const [max, s] of t) if (v < max) return s; return t[t.length-1][1]; }
function profile(){
  const m = S.m || {}, P = { g: S.g };
  if (S.g === "m") {
    P.top = pick(m.chest, MT); P.bottom = pick(m.waist, MB);
    P.waist = m.waist == null ? null : Math.round(m.waist);

    const fit = (i, v) => { if (v == null) return 0; for (const r of DRESS) if (v <= r[i]) return r[0]; return 20; };
    P.dress = Math.max(fit(1, m.chest), fit(2, m.waist), fit(3, m.hips));
    P.jean = m.waist == null ? null : Math.max(22, Math.min(36, Math.round(m.waist - 0.5)));

}
function sizeList(){
  const P = profile();

/* fit meter: where your body sits inside the size you'd order */
function bracket(t, letter){
  const i = t.findIndex(r => r[1] === letter); if (i < 0) return null;
  const hi = t[i][0] === 999 ? t[i-1][0] + 4 : t[i][0];
  const lo = i === 0 ? hi - 3 : t[i-1][0];
  return [lo, hi];
}
function fitRows(item){
  const m = S.m, rows = [];
  const girth = (name, v, lo, hi) => rows.push({ name, x: clamp((v - lo) / (hi - lo)), a: "Roomy", b: "Snug" });
  const near = (name, v, target, span, a, b) => rows.push({ name, x: clamp(0.5 + (v - target) / span), a, b });
  String(item.sizes[0] || "").split(" · ").forEach((p, i) => {
    const up = p.toUpperCase().trim();
    let mm = up.match(/^(\d{2})\s*W?\s*[X\/]\s*(\d{2})/);
    if (mm) { near("Waist", m.waist, +mm[1], 2, "Roomy", "Snug"); near("Length", m.inseam, +mm[2], 2, "Long", "Short"); return; }
    mm = up.match(/^(XXXS|XXS|2XS|XS|XXXL|3XL|2XL|XXL|XL|S|M|L|SMALL|MEDIUM|LARGE)\b/);
    if (mm) {
      const L = ({SMALL:"S",MEDIUM:"M",LARGE:"L","2XL":"XXL","XXXL":"3XL","2XS":"XXS"})[mm[1]] || mm[1];
      if (item.cat === "bottoms") {
        const t = S.g === "m" ? MB : WB, v = S.g === "m" ? m.waist : m.hips, br = bracket(t, L);
        if (br) girth(S.g === "m" ? "Waist" : "Hips", v, br[0], br[1]);
      } else {
        const t = S.g === "m" ? MT : WT, br = bracket(t, L);
        if (br) girth(S.g === "m" ? "Chest" : "Bust", m.chest, br[0], br[1]);
      }
      return;
    }
    const n = parseFloat(up);
    if (isNaN(n)) return;
    if (i > 0 && n >= 25 && n <= 38) { near("Length", m.inseam, n, 2, "Long", "Short"); return; }
    if (S.g === "w" && n <= 20) {
      const r = DRESS.find(x => x[0] === n);
      if (r) { near("Bust", m.chest, r[1], 2, "Roomy", "Snug"); near("Waist", m.waist, r[2], 2, "Roomy", "Snug"); near("Hips", m.hips, r[3], 2, "Roomy", "Snug"); }
      return;
    }
    if (S.g === "w") { near("Waist", m.waist - 0.5, n, 2, "Roomy", "Snug"); return; }
    if (item.cat === "tops" || item.cat === "outerwear") { near("Chest", m.chest, n, 4, "Roomy", "Snug"); return; }
    near("Waist", m.waist, n, 2, "Roomy", "Snug");

}

}

/* ---------- data ---------- */
let seq = { search: 0, new: 0, counts: 0 };
const API = "https://script.google.com/macros/s/AKfycbwVdjMKGa25mKV18_2QI1oinM1btLattRPDe1tRGzVEOchyaG2ilorAWdkopmrhGVKt/exec";
function call(P, ok, fail){
  fetch(API + "?api=search&p=" + encodeURIComponent(JSON.stringify(P)), { credentials: "omit", redirect: "follow" })
    .then(r => { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
    .then(r => r && r.error ? fail({ message: r.error }) : ok(r))
    .catch(e => fail(e));
}
function fetchCounts(){
  const id = ++seq.counts; S.counting = true;
  const P = profile(); P.cat = "all";
  call(P, r => { if (id !== seq.counts) return; S.counting = false; S.byCat = r.byCat; if (S.view === "fit" && !S.editing) { S.keepScroll = true; render(); } },
          () => { if (id !== seq.counts) return; S.counting = false; });
}
function fetchList(kind){
  const id = ++seq[kind];
  S.loading[kind] = true; S.err[kind] = "";
  const P = profile();
  if (kind === "search") { const f = S.search; P.cat = f.cat; P.q = f.q; P.styles = f.styles; P.maxPrice = f.max; }
  else { const f = S.newf; P.cat = f.cat; P.mode = "new"; P.season = f.season; }
  if (S.view === kind) { S.keepScroll = true; render(); }
  call(P, r => { if (id !== seq[kind]) return; S.loading[kind] = false; S.res[kind] = r; if (S.view === kind) { S.keepScroll = true; render(); } },
          e => { if (id !== seq[kind]) return; S.loading[kind] = false; S.err[kind] = "Couldn't reach the stores. " + (e && e.message || ""); if (S.view === kind) render(); });
}
function sizesChanged(){ S.byCat = null; S.res.search = null; S.res.new = null; }

/* ---------- steppers with hold-to-repeat ---------- */
let countT = null;
function bump(k, dir){
  const [lo, hi] = LIM[k];
  let v = S.m[k] ?? DEF[S.g][k];
  if (S.unit === "in") v = Math.round((v + dir * 0.5) * 2) / 2;
  else v = (Math.round(v * 2.54) + dir) / 2.54;
  S.m[k] = Math.max(lo, Math.min(hi, v)); save();
  document.querySelectorAll(`[data-val="${k}"]`).forEach(e => e.textContent = fmt(S.m[k]));
  const ch = document.getElementById("chips"); if (ch) ch.innerHTML = chipsHTML();
  const pl = document.getElementById("pill"); if (pl) pl.textContent = pillText();
  sizesChanged();
  if (S.view === "fit") { clearTimeout(countT); countT = setTimeout(fetchCounts, 1200); }
}
let holdT = null, holdI = null;
const stopHold = () => { clearTimeout(holdT); clearInterval(holdI); holdT = holdI = null; };
app.addEventListener("pointerdown", e => {
  const b = e.target.closest("[data-step]"); if (!b) return;
  e.preventDefault(); stopHold();
  const k = b.dataset.k, d = +b.dataset.step;
  bump(k, d);
  holdT = setTimeout(() => { holdI = setInterval(() => bump(k, d), 90); }, 380);
});
["pointerup", "pointercancel", "pointerleave"].forEach(t => document.addEventListener(t, stopHold));

/* ---------- photo try-on ---------- */
const sleep = ms => new Promise(r => setTimeout(r, ms));
const bigImg = u => String(u || "").replace(/width=\d+/, "width=1200");
function resizePhoto(file){
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onerror = () => rej(new Error("Couldn't read that photo."));
    fr.onload = () => {
      const img = new Image();
      img.onerror = () => rej(new Error("That file isn't a photo we can use."));
      img.onload = () => {
        const max = 1024, k = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement("canvas"); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        res(c.toDataURL("image/jpeg", 0.85));
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}
function photoCard(){
  return `<section class="card" aria-label="Try-on photo" style="margin-top:18px">
    <span class="lb">Your try-on photo</span>
    <div class="photo" style="margin-top:10px">
      ${S.photo ? `<img src="${S.photo}" alt="Your try-on photo">` : `<div class="ph0"></div>`}
      <div style="display:flex;flex-direction:column;gap:6px;min-width:0">
        <p style="margin:0;font-size:14px">${S.photo ? "Ready. Open any item and tap Try it on." : "Add one photo and see clothes on you before you buy."}</p>
        <span style="display:flex;gap:14px;align-items:center">
          <label class="link filebtn" style="padding:0">${S.photo ? "Change photo" : "Add a photo"}<input type="file" accept="image/*" data-photo="card"></label>
          ${S.photo ? `<button class="link" data-act="rmphoto" style="padding:0">Remove</button>` : ""}
        </span>
      </div>
    </div>
    <p class="small" style="margin-top:10px">Best results: head to knees, standing straight, fitted clothes, plain background. Your photo stays on this phone and is only sent to our try-on partner when you tap Try it on.</p>
  </section>`;
}
// One try-on pass: person (data URL) + garment item -> result image URL
async function runTryOn(person, x){
  const start = await fetch(API, { method: "POST", credentials: "omit", redirect: "follow",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify({ api: "tryon", person: person, garment: bigImg(x.img), category: x.cat }) }).then(r => r.json());
  if (start.error) throw new Error(start.error);
  for (let i = 0; i < 45; i++) {
    await sleep(i < 2 ? 6000 : 3000);
    const s = await fetch(API + "?api=tryon_status&s=" + encodeURIComponent(start.status) + "&r=" + encodeURIComponent(start.result), { credentials: "omit" }).then(r => r.json());
    if (s.error) throw new Error(s.error);
    if (s.done) return s.url;
  }
  throw new Error("That took too long. Try again.");
}
async function urlToData(u){
  const b = await fetch(u, { credentials: "omit" }).then(r => { if (!r.ok) throw new Error("Couldn't load the last step."); return r.blob(); });
  return await new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.onerror = () => rej(new Error("Couldn't load the last step.")); fr.readAsDataURL(b); });
}
async function tryOn(x){
  const key = x.url;
  S.tries[key] = { status: "loading" }; S.keepScroll = true; render();
  try {
    const url = await runTryOn(S.photo, x);
    S.tries[key] = { status: "done", img: url, view: "me" }; if (S.view === "detail") { S.keepScroll = true; render(); }
  } catch (e) {
    S.tries[key] = { status: "error", err: (e && e.message) || "Something went wrong. Try again." };
    if (S.view === "detail") { S.keepScroll = true; render(); }
  }
}
/* ---------- outfits (chained try-on) ---------- */
const SLOT = x => x.cat === "bottoms" ? "bottom" : x.cat === "outerwear" ? "outer" : "top";
const SLOT_ORDER = ["bottom", "top", "outer"];
const SLOT_WORD = { bottom: "bottoms", top: "top", outer: "jacket" };
const inOutfit = x => S.outfit.some(o => o.url === x.url);
const saveOutfit = () => LS.set("fm_outfit", S.outfit);
function addToOutfit(x){
  const sl = SLOT(x);
  S.outfit = S.outfit.filter(o => SLOT(o) !== sl);
  if (x.cat === "dresses") S.outfit = S.outfit.filter(o => SLOT(o) !== "bottom");
  if (sl === "bottom") S.outfit = S.outfit.filter(o => o.cat !== "dresses");
  S.outfit.push({ brand: x.brand, title: x.title, img: x.img, price: x.price, sizes: x.sizes, cat: x.cat, url: x.url });
  saveOutfit(); S.ofit = {};
}
function removeFromOutfit(url){ S.outfit = S.outfit.filter(o => o.url !== url); saveOutfit(); S.ofit = {}; }
const orderedOutfit = () => SLOT_ORDER.map(s => S.outfit.find(o => SLOT(o) === s)).filter(Boolean);
async function tryOutfit(){
  const pieces = orderedOutfit(); if (!pieces.length || !S.photo) return;
  S.ofit = { status: "loading", step: 1, total: pieces.length, word: SLOT_WORD[SLOT(pieces[0])] };
  if (S.view === "outfit") { S.keepScroll = true; render(); }
  try {
    let person = S.photo, url = null;
    for (let i = 0; i < pieces.length; i++) {
      S.ofit.step = i + 1; S.ofit.word = SLOT_WORD[SLOT(pieces[i])];
      if (S.view === "outfit") { S.keepScroll = true; render(); }
      url = await runTryOn(person, pieces[i]);
      if (i < pieces.length - 1) person = await urlToData(url);
    }
    S.ofit = { status: "done", img: url };
    await saveLook(url, pieces);
  } catch (e) {
    S.ofit = { status: "error", err: (e && e.message) || "Something went wrong. Try again." };
  }
  if (S.view === "outfit") { S.keepScroll = true; render(); }
}
function outfitBar(){
  if (S.view === "outfit" || S.view === "onboard" || S.sheet) return "";
  if (!S.outfit.length) return S.looks.length ? `<div class="obar" role="region" aria-label="Past outfits"><div class="obar-in">
    ${S.looks.slice(0, 3).map(l => `<img src="${esc(l.img)}" alt="" onerror="this.style.visibility='hidden'">`).join("")}
    <span style="font-size:13px"><b>Past outfits</b><br><span class="m">${S.looks.length} saved</span></span>
    <button data-act="go" data-v="outfit">View</button></div></div>` : "";
  const total = S.outfit.reduce((t, o) => t + (o.price || 0), 0);
  return `<div class="obar" role="region" aria-label="Your outfit"><div class="obar-in">
    ${orderedOutfit().map(o => o.img ? `<img src="${esc(o.img)}" alt="">` : "").join("")}
    <span style="font-size:13px"><b>${S.outfit.length} ${S.outfit.length === 1 ? "piece" : "pieces"}</b><br><span class="m">$${Math.round(total)}</span></span>
    <button data-act="go" data-v="outfit">View outfit</button></div></div>`;
}
/* ---------- saved outfits: newest first, keep 4, oldest drops off ---------- */
const MAX_LOOKS = 4;
async function shrinkImage(u){
  const data = await urlToData(u);
  const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = data; });
  const w = Math.min(640, img.naturalWidth), h = Math.round(img.naturalHeight * w / img.naturalWidth);
  const c = document.createElement("canvas"); c.width = w; c.height = h;
  c.getContext("2d").drawImage(img, 0, 0, w, h);
  return c.toDataURL("image/jpeg", 0.8);
}
function storeLooks(){
  // keep the image copies if they fit; otherwise fall back to links, then drop the oldest
  for (let n = S.looks.length; n > 0; n--) {
    const list = S.looks.slice(0, n);
    try { localStorage.setItem("fm_looks", JSON.stringify(list)); S.looks = list; return; } catch (e) {}
    try { localStorage.setItem("fm_looks", JSON.stringify(list.map(l => ({ ...l, img: l.src })))); S.looks = list; return; } catch (e) {}
  }
}
async function saveLook(url, pieces){
  let img = url;
  try { img = await shrinkImage(url); } catch (e) {}
  const look = { id: Date.now(), at: new Date().toISOString(), img: img, src: url,
    pieces: pieces.map(x => ({ brand: x.brand, title: x.title, img: x.img, price: x.price, sizes: x.sizes, cat: x.cat, url: x.url })) };
  S.looks = [look, ...S.looks].slice(0, MAX_LOOKS);
  storeLooks();
}
function deleteLook(id){ S.looks = S.looks.filter(l => String(l.id) !== String(id)); storeLooks(); if (!S.looks.length) LS.set("fm_looks", []); }
function wearLook(id){
  const l = S.looks.find(l => String(l.id) === String(id)); if (!l) return;
  S.outfit = l.pieces.map(x => ({ ...x })); saveOutfit();
  S.ofit = { status: "done", img: l.img };
}
function looksSection(){
  if (!S.looks.length) return "";
  const when = iso => { const d = new Date(iso); return d.toLocaleDateString(undefined, { month: "short", day: "numeric" }); };
  return `<h2 class="lb" style="margin:34px 0 0;display:block">Past outfits <span class="muted" style="text-transform:none;letter-spacing:0;font-weight:500">· last ${MAX_LOOKS} kept</span></h2>
    <div class="looks">${S.looks.map(l => {
      const total = l.pieces.reduce((t, x) => t + (x.price || 0), 0);
      return `<div class="look"><img src="${esc(l.img)}" alt="Saved outfit from ${esc(when(l.at))}" loading="lazy" onerror="this.style.visibility='hidden'">
        <div class="lk-b"><span class="small">${esc(when(l.at))} · $${Math.round(total)}</span>
        ${l.pieces.map(x => `<div class="lk-p"><span style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"><b>${esc(x.brand)}</b> ${esc(x.title)} · ${esc(x.sizes[0])}</span><a href="${esc(x.url)}" target="_blank" rel="noopener">Shop</a></div>`).join("")}
        <div class="lk-x"><button class="link" data-act="lwear" data-v="${l.id}" style="padding:0;font-size:12px;font-weight:700">Wear again</button><button class="link" data-act="ldel" data-v="${l.id}" style="padding:0;font-size:12px">Delete</button></div></div></div>`;
    }).join("")}</div>`;
}
function vOutfit(){
  const pieces = orderedOutfit(), o = S.ofit || {};
  const total = pieces.reduce((t, x) => t + (x.price || 0), 0);
  const back = S.prevOut === "detail" ? "Back" : S.prevOut === "new" ? "New Arrivals" : S.prevOut === "fit" ? "Fit" : S.prevOut === "today" ? "Today" : "Search";
  if (!pieces.length) return `${header()}
    <h1 class="d" style="font-size:44px;margin-bottom:10px">Your outfit</h1>
    <p class="muted">Add a top, bottoms and a jacket from any product page, then see the whole look on you.</p>
    <button class="btn" data-act="go" data-v="search" style="margin-top:14px">Find pieces</button>${looksSection()}`;
  return `${header()}
    <button class="link" data-act="go" data-v="${S.prevOut === "detail" ? "detail" : S.prevOut}" style="text-decoration:none;padding:0 0 6px">← ${back}</button>
    <h1 class="d" style="font-size:44px;margin-bottom:6px">Your outfit</h1>
    <div>${pieces.map(x => `<div class="piece">${x.img ? `<img src="${esc(x.img)}" alt="">` : `<div style="width:60px;height:76px"></div>`}
      <div style="flex:1;min-width:0"><span class="lb">${esc(x.brand)}</span><div style="font-size:14px;font-weight:600;line-height:1.3">${esc(x.title)}</div>
      <span class="m" style="font-size:13px">$${Math.round(x.price)} · <span class="tag">${esc(x.sizes[0])}</span></span></div>
      <span style="display:flex;flex-direction:column;align-items:flex-end;gap:2px"><a href="${esc(x.url)}" target="_blank" rel="noopener" style="font-size:13px;font-weight:700">Shop</a><button class="link" data-act="ormv" data-v="${esc(x.url)}" style="padding:0;font-size:12px">Remove</button></span></div>`).join("")}</div>
    <div style="display:flex;justify-content:space-between;align-items:baseline;margin:12px 0 16px"><span class="lb">Total</span><span class="m" style="font-size:22px">$${Math.round(total)}</span></div>
    ${o.status === "done" ? `<img class="ph" src="${esc(o.img)}" alt="You wearing this outfit" style="aspect-ratio:4/5">
      <p style="margin:8px 0 14px;font-size:13px"><a href="${esc(o.img)}" target="_blank" rel="noopener">Open full image</a> <span class="muted">to save or share it</span></p>` : ""}
    ${o.status === "loading" ? `<div class="card" role="status"><div style="display:flex;gap:12px;align-items:center"><span class="spin" aria-hidden="true"></span><div><b>Step ${o.step} of ${o.total}: adding the ${o.word}…</b><div class="small">About 20 seconds per piece</div></div></div>
      <div class="steps">${Array.from({ length: o.total }, (_, i) => `<span class="${i < o.step ? "on" : ""}"></span>`).join("")}</div></div>` : ""}
    ${o.status === "error" ? `<p class="err">${esc(o.err)}</p>` : ""}
    <div style="margin-top:14px">${S.photo
      ? `<button class="btn pink" data-act="tryoutfit" ${o.status === "loading" ? "disabled" : ""}>${o.status === "done" ? "See it on me again" : "See it on me"}</button>`
      : `<label class="btn pink filebtn">Add your photo to see it on you<input type="file" accept="image/*" data-photo="outfit"></label>`}</div>
    <p class="small" style="margin-top:10px">Pieces go on one at a time: bottoms, then top, then jacket. Each piece counts as one try-on.</p>${looksSection()}`;
}
app.addEventListener("change", async e => {
  const inp = e.target.closest("input[data-photo]"); if (!inp || !inp.files || !inp.files[0]) return;
  try {
    S.photo = await resizePhoto(inp.files[0]);
    LS.set("fm_photo", S.photo);
    S.keepScroll = true; render();
    if (inp.dataset.photo === "detail" && S.item) tryOn(S.item);
    if (inp.dataset.photo === "outfit") tryOutfit();
  } catch (err) { console.warn(err); }
});

/* ---------- events ---------- */
function go(v){ if (v === "outfit" && S.view !== "outfit") S.prevOut = S.view; S.view = v; S.editing = null; render(); window.scrollTo(0, 0); }
app.addEventListener("click", e => {
  const st = e.target.closest("[data-step]");
  if (st) { if (e.detail === 0) bump(st.dataset.k, +st.dataset.step); return; } // keyboard
  const b = e.target.closest("[data-act]"); if (!b) return;
  const a = b.dataset.act, v = b.dataset.v;
  if (a === "sheet-close" && e.target !== b && !e.target.closest(".link")) return;
  if (a === "go") { if (hasM() || v === "today" || v === "outfit") go(v); else { S.step = 0; go("onboard"); } }
  else if (a === "sheet") { S.sheet = true; S.keepScroll = true; render(); }
  else if (a === "sheet-close") { S.sheet = false; S.keepScroll = true; render(); }
  else if (a === "theme") { S.theme = v; LS.set("fm_theme2", v); document.documentElement.dataset.theme = v; S.keepScroll = true; render(); }
  else if (a === "g") { S.g = v; save(); sizesChanged(); S.search.styles = []; render(); }
  else if (a === "unit") { S.unit = v; save(); render(); }
  else if (a === "next") {
    if (S.step < STEPS.length - 1) { S.step++; render(); }
    else { sizesChanged(); go("today"); }
  }
  else if (a === "back") { if (S.step > 0) { S.step--; render(); } }
  else if (a === "edit") { S.editing = S.editing === b.dataset.k ? null : b.dataset.k; S.keepScroll = true; render(); }
  else if (a === "done") { S.editing = null; S.keepScroll = true; render(); }
  else if (a === "tile") {
    Object.assign(S.search, { cat: v === "under100" ? "all" : v, max: v === "under100" ? 100 : 0, styles: [], q: "" });
    S.res.search = null; go("search");
  }
  else if (a === "scat") { S.search.cat = v; fetchList("search"); }
  else if (a === "style") { const s = S.search.styles, i = s.indexOf(v); i < 0 ? s.push(v) : s.splice(i, 1); fetchList("search"); }
  else if (a === "price") { S.search.max = +v; fetchList("search"); }
  else if (a === "clear") { Object.assign(S.search, { cat: "all", q: "", styles: [], max: 0 }); fetchList("search"); }
  else if (a === "season") { S.newf.season = v; fetchList("new"); }
  else if (a === "ncat") { S.newf.cat = v; fetchList("new"); }
  else if (a === "retry") { fetchList(v); }
  else if (a === "open") { const src = b.dataset.src; S.item = S.res[src].items[+b.dataset.i]; S.prev = src; go("detail"); }
  else if (a === "oadd") { addToOutfit(S.item); S.keepScroll = true; render(); }
  else if (a === "orm") { removeFromOutfit(S.item.url); S.keepScroll = true; render(); }
  else if (a === "ormv") { removeFromOutfit(v); S.keepScroll = true; render(); }
  else if (a === "tryoutfit") { tryOutfit(); }
  else if (a === "lwear") { wearLook(v); render(); window.scrollTo(0, 0); }
  else if (a === "ldel") { deleteLook(v); S.keepScroll = true; render(); }
  else if (a === "tryon") { if (S.item && S.photo) tryOn(S.item); }
  else if (a === "tview") { const t = S.tries[S.item.url]; if (t) { t.view = v; S.keepScroll = true; render(); } }
  else if (a === "rmphoto") { S.photo = null; try { localStorage.removeItem("fm_photo"); } catch (err) {} S.keepScroll = true; render(); }
  else if (a === "redo") { S.step = 0; go("onboard"); }
});
app.addEventListener("submit", e => {
  e.preventDefault();
  S.search.q = document.getElementById("q").value.trim();
  fetchList("search");
});

render();
</script>
